<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <meta name="theme-color" content="#f4f3ed">
  <title>GRID / Expense Ledger</title>
  <style>
    :root {
      --paper: #f4f3ed;
      --paper-raised: #fbfaf5;
      --ink: #11110f;
      --muted: #6e6e66;
      --faint: #b5b5ae;
      --line: #d3d2c9;
      --line-light: #e4e3da;
      --mint: #0c6b51;
      --mint-pale: #dcebe4;
      --danger: #a33d32;
      --page-gutter: clamp(1rem, 4vw, 2.5rem);
      color-scheme: light;
      font-family: "Helvetica Neue", Helvetica, Arial, sans-serif;
      font-synthesis: none;
      font-variant-numeric: tabular-nums;
      -webkit-font-smoothing: antialiased;
    }

    * {
      box-sizing: border-box;
    }

    html {
      min-width: 20rem;
      background: var(--paper);
    }

    body {
      min-height: 100vh;
      margin: 0;
      color: var(--ink);
      background: var(--paper);
    }

    button,
    input {
      font: inherit;
    }

    button {
      color: inherit;
    }

    button:focus-visible,
    input:focus-visible {
      outline: 2px solid var(--mint);
      outline-offset: 3px;
    }

    button,
    [role="button"] {
      -webkit-tap-highlight-color: transparent;
    }

    .masthead {
      display: grid;
      grid-template-columns: minmax(0, 1fr) auto;
      align-items: end;
      gap: 1rem 2rem;
      padding: 1.1rem var(--page-gutter) 0.8rem;
      border-bottom: 1px solid var(--ink);
    }

    .brand {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      min-width: 0;
    }

    .brand__name {
      font-size: 1.25rem;
      font-weight: 800;
      letter-spacing: -0.04em;
      line-height: 1;
    }

    .eyebrow,
    .meta,
    .section-number,
    .field-label,
    .status,
    .bar-label,
    .activity-date,
    .button-note {
      font-size: 0.625rem;
      font-weight: 600;
      letter-spacing: 0.16em;
      line-height: 1.4;
      text-transform: uppercase;
    }

    .eyebrow,
    .meta,
    .section-number,
    .field-label,
    .bar-label,
    .activity-date,
    .button-note {
      color: var(--muted);
    }

    .masthead__tools {
      display: flex;
      align-items: center;
      justify-content: flex-end;
      gap: 0.85rem 1.5rem;
      flex-wrap: wrap;
    }

    .currency-picker {
      display: flex;
      align-items: center;
      gap: 0.25rem;
    }

    .currency-picker .field-label {
      margin-right: 0.3rem;
    }

    .currency-chip,
    .currency-add {
      min-width: 2rem;
      height: 2rem;
      padding: 0 0.55rem;
      border: 1px solid var(--line);
      background: transparent;
      font-size: 0.6875rem;
      font-weight: 750;
      cursor: pointer;
    }

    .currency-chip:hover,
    .currency-chip.is-active {
      border-color: var(--ink);
      color: var(--paper-raised);
      background: var(--ink);
    }

    .currency-add {
      border-style: dashed;
      color: var(--muted);
    }

    .currency-form {
      display: flex;
      height: 2rem;
    }

    .currency-form input {
      width: 4.25rem;
      border: 1px solid var(--ink);
      border-right: 0;
      border-radius: 0;
      background: var(--paper-raised);
      padding: 0 0.5rem;
      font-size: 0.75rem;
      font-weight: 700;
      text-transform: uppercase;
    }

    .currency-form button {
      border: 1px solid var(--ink);
      background: var(--ink);
      color: white;
      padding: 0 0.65rem;
      font-size: 0.625rem;
      font-weight: 700;
      letter-spacing: 0.1em;
      cursor: pointer;
    }

    .connection-strip {
      display: flex;
      justify-content: space-between;
      gap: 1rem;
      padding: 0.55rem var(--page-gutter);
      border-bottom: 1px solid var(--line);
      background: var(--mint-pale);
    }

    .status {
      display: inline-flex;
      align-items: center;
      gap: 0.5rem;
      color: var(--mint);
    }

    .status::before {
      width: 0.45rem;
      height: 0.45rem;
      border-radius: 50%;
      background: currentColor;
      content: "";
    }

    .page {
      width: min(100%, 77.5rem);
      margin: 0 auto;
      padding: 0 var(--page-gutter) 4rem;
    }

    .ledger-section {
      padding: clamp(1.65rem, 4vw, 2.3rem) 0;
      border-bottom: 1px solid var(--ink);
    }

    .section-heading {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      margin-bottom: 1.35rem;
    }

    .entry-grid,
    .month-grid,
    .lower-grid {
      display: grid;
    }

    .entry-grid {
      grid-template-columns: minmax(17.5rem, 1.05fr) minmax(18rem, 0.95fr);
      align-items: end;
      gap: clamp(1.5rem, 5vw, 4.5rem);
    }

    .money-field {
      display: flex;
      align-items: baseline;
      gap: 0.7rem;
      border-bottom: 2px solid var(--ink);
      padding-bottom: 0.45rem;
    }

    .money-field__currency {
      color: var(--faint);
      font-size: clamp(1.8rem, 6vw, 2.65rem);
      font-weight: 400;
      line-height: 1;
    }

    .money-field input {
      width: 100%;
      min-width: 0;
      border: 0;
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      font-size: clamp(2.75rem, 9vw, 4.8rem);
      font-weight: 750;
      letter-spacing: -0.055em;
      line-height: 0.95;
      padding: 0;
    }

    .money-field input::placeholder,
    .note-field::placeholder,
    .inline-form input::placeholder {
      color: var(--faint);
    }

    .note-field {
      width: 100%;
      margin-top: 0.85rem;
      border: 0;
      border-bottom: 1px solid var(--line);
      border-radius: 0;
      outline: 0;
      background: transparent;
      color: var(--ink);
      padding: 0.75rem 0;
      font-size: 0.9375rem;
    }

    .category-list {
      display: flex;
      flex-wrap: wrap;
      gap: 0.4rem;
      margin-top: 0.55rem;
    }

    .category-chip,
    .new-category {
      min-height: 2.75rem;
      padding: 0 0.85rem;
      border: 1px solid var(--line);
      background: transparent;
      font-size: 0.6875rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .category-chip:hover,
    .category-chip.is-active {
      border-color: var(--mint);
      color: white;
      background: var(--mint);
    }

    .new-category {
      border-style: dashed;
      color: var(--muted);
    }

    .inline-form {
      display: flex;
      margin-top: 0.5rem;
    }

    .inline-form input {
      flex: 1;
      min-width: 0;
      min-height: 2.75rem;
      border: 1px solid var(--ink);
      border-radius: 0;
      outline: 0;
      background: var(--paper-raised);
      color: var(--ink);
      padding: 0 0.75rem;
    }

    .inline-form button {
      min-height: 2.75rem;
      border: 1px solid var(--ink);
      border-left: 0;
      border-radius: 0;
      background: var(--ink);
      color: white;
      padding: 0 0.9rem;
      font-size: 0.625rem;
      font-weight: 750;
      letter-spacing: 0.12em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .inline-form .button-secondary {
      border-color: var(--line);
      background: transparent;
      color: var(--muted);
    }

    .add-expense {
      display: flex;
      align-items: center;
      justify-content: space-between;
      width: 100%;
      min-height: 3.35rem;
      margin-top: 0.8rem;
      border: 1px solid var(--mint);
      border-radius: 0;
      background: var(--mint);
      color: white;
      padding: 0 1rem;
      font-size: 0.75rem;
      font-weight: 800;
      letter-spacing: 0.13em;
      text-transform: uppercase;
      cursor: pointer;
    }

    .add-expense:hover {
      background: var(--ink);
      border-color: var(--ink);
    }

    .add-expense[disabled] {
      border-color: var(--line);
      background: var(--line);
      color: var(--muted);
      cursor: not-allowed;
    }

    .add-expense .button-note {
      color: inherit;
      opacity: 0.7;
    }

    .notice {
      min-height: 1.25rem;
      margin: 0.65rem 0 0;
      color: var(--muted);
      font-size: 0.75rem;
      line-height: 1.45;
    }

    .month-grid {
      grid-template-columns: minmax(0, 0.8fr) minmax(0, 1.2fr);
      align-items: end;
      gap: clamp(2rem, 6vw, 5.5rem);
    }

    .month-grid > * {
      min-width: 0;
    }

    .month-summary {
      container-type: inline-size;
    }

    .total {
      font-size: clamp(2.75rem, 6.5vw, 5.25rem);
      font-size: clamp(2.75rem, 16cqw, 6rem);
      font-weight: 800;
      letter-spacing: -0.07em;
      line-height: 0.82;
      white-space: nowrap;
    }

    .total-meta {
      display: flex;
      flex-wrap: wrap;
      gap: 0.7rem 1.4rem;
      margin-top: 1.3rem;
    }

    .metric {
      display: flex;
      align-items: baseline;
      gap: 0.45rem;
    }

    .metric strong {
      font-size: 0.9375rem;
    }

    .bars {
      display: flex;
      align-items: flex-end;
      gap: clamp(0.4rem, 1.4vw, 0.9rem);
      height: 12rem;
      border-bottom: 1px solid var(--ink);
    }

    .bar-button {
      display: flex;
      flex: 1;
      flex-direction: column;
      justify-content: flex-end;
      min-width: 2rem;
      height: 100%;
      border: 0;
      background: transparent;
      padding: 0;
      cursor: pointer;
    }

    .bar-value {
      margin-bottom: 0.35rem;
      color: var(--muted);
      font-size: 0.625rem;
      line-height: 1;
      opacity: 0;
      transition: opacity 130ms ease;
    }

    .bar-button:hover .bar-value,
    .bar-button.is-active .bar-value {
      opacity: 1;
    }

    .bar-fill {
      width: 100%;
      height: max(0.4rem, var(--height));
      background: var(--line);
      transition: height 180ms ease, background 180ms ease;
    }

    .bar-button:hover .bar-fill,
    .bar-button.is-active .bar-fill {
      background: var(--mint);
    }

    .bar-labels {
      display: flex;
      gap: clamp(0.4rem, 1.4vw, 0.9rem);
      margin-top: 0.55rem;
    }

    .bar-label {
      flex: 1;
      min-width: 2rem;
      text-align: center;
    }

    .lower-grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 0 clamp(2rem, 6vw, 5rem);
    }

    .lower-grid .ledger-section {
      border-bottom-color: var(--line);
    }

    .category-row {
      padding: 0.8rem 0;
      border-top: 1px solid var(--line-light);
    }

    .category-row__top,
    .activity-row {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
    }

    .category-name,
    .activity-category {
      font-size: 0.9375rem;
      font-weight: 750;
      letter-spacing: -0.015em;
    }

    .category-numbers {
      display: flex;
      align-items: baseline;
      gap: 0.85rem;
    }

    .category-amount {
      font-size: 0.9375rem;
    }

    .category-delta {
      min-width: 3.6rem;
      color: var(--muted);
      font-size: 0.6875rem;
      text-align: right;
    }

    .category-delta.is-up {
      color: var(--danger);
    }

    .category-delta.is-down {
      color: var(--mint);
    }

    .category-meter {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 2.75rem;
      align-items: center;
      gap: 0.65rem;
      margin-top: 0.5rem;
    }

    .category-track {
      height: 0.5rem;
      background: var(--line-light);
    }

    .category-track span {
      display: block;
      width: var(--width);
      height: 100%;
      background: var(--mint);
    }

    .category-percent {
      color: var(--muted);
      font-size: 0.6875rem;
      text-align: right;
    }

    .insight {
      margin-top: 1rem;
      border-left: 3px solid var(--mint);
      background: var(--mint-pale);
      padding: 0.9rem 1rem;
    }

    .insight p {
      margin: 0.3rem 0 0;
      font-size: 0.9375rem;
      font-weight: 700;
      line-height: 1.4;
    }

    .activity-row {
      min-height: 3.6rem;
      padding: 0.75rem 0;
      border-top: 1px solid var(--line-light);
    }

    .activity-main {
      display: grid;
      grid-template-columns: 3.35rem minmax(0, 1fr);
      align-items: baseline;
      gap: 0.8rem;
      min-width: 0;
    }

    .activity-note {
      overflow: hidden;
      margin-top: 0.15rem;
      color: var(--muted);
      font-size: 0.75rem;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .activity-amount {
      flex: none;
      font-size: 0.9375rem;
    }

    .empty-state {
      border-top: 1px solid var(--line-light);
      color: var(--muted);
      padding: 1rem 0;
      font-size: 0.8125rem;
      line-height: 1.5;
    }

    .page-footer {
      display: flex;
      align-items: baseline;
      justify-content: space-between;
      gap: 1rem;
      padding-top: 1rem;
    }

    .page-footer a {
      color: var(--mint);
      font-size: 0.6875rem;
      font-weight: 750;
      letter-spacing: 0.08em;
      text-decoration: none;
      text-transform: uppercase;
    }

    @media (max-width: 1050px) {
      .month-grid {
        grid-template-columns: 1fr;
        align-items: stretch;
        gap: 2rem;
      }
    }

    @media (max-width: 800px) {
      .masthead,
      .entry-grid,
      .month-grid,
      .lower-grid {
        grid-template-columns: 1fr;
      }

      .masthead__tools {
        justify-content: space-between;
      }

      .entry-grid,
      .month-grid {
        align-items: stretch;
      }

      .month-grid {
        gap: 2rem;
      }

      .lower-grid {
        gap: 0;
      }
    }

    @media (max-width: 520px) {
      .masthead__tools,
      .connection-strip,
      .section-heading,
      .page-footer {
        align-items: flex-start;
        flex-direction: column;
      }

      .masthead__tools {
        display: flex;
      }

      .currency-picker {
        max-width: 100%;
        flex-wrap: wrap;
      }

      .entry-grid {
        grid-template-columns: minmax(0, 1fr);
      }

      .total {
        font-size: clamp(2.75rem, 16cqw, 4.75rem);
      }

      .bars {
        height: 9rem;
      }

      .inline-form {
        flex-wrap: wrap;
      }

      .inline-form input {
        flex-basis: 100%;
      }

      .inline-form button {
        flex: 1;
        border-top: 0;
        border-left: 1px solid var(--ink);
      }
    }

    @media (prefers-reduced-motion: reduce) {
      *,
      *::before,
      *::after {
        scroll-behavior: auto !important;
        transition-duration: 0.01ms !important;
      }
    }
  </style>
</head>
<body>
  <div id="expense-app"></div>
  <noscript>This expense ledger needs JavaScript enabled for client-side interactions.</noscript>

  <script type="module">
    import { html, reactive } from "@arrow-js/core";
    import htmx from "htmx.org";

    htmx.config.allowEval = false;
    window.htmx = htmx;

    const state = reactive({
      selectedMonth: "2026-08",
      currency: "€",
      currencies: ["€", "$", "£", "RON"],
      amount: "",
      note: "",
      selectedCategory: "Groceries",
      categories: ["Rent", "Groceries", "Transport", "Dining", "Utilities", "Health", "Fun"],
      categoryEditorOpen: false,
      categoryDraft: "",
      currencyEditorOpen: false,
      currencyDraft: "",
      notice: "Preview mode: changes stay in this browser session and are not written to SQLite yet.",
      monthOrder: ["2026-03", "2026-04", "2026-05", "2026-06", "2026-07", "2026-08"],
      monthLabels: {
        "2026-03": "Mar",
        "2026-04": "Apr",
        "2026-05": "May",
        "2026-06": "Jun",
        "2026-07": "Jul",
        "2026-08": "Aug"
      },
      months: {
        "2026-03": { Rent: 1200, Groceries: 420, Transport: 95, Dining: 210, Utilities: 130, Health: 60, Fun: 140 },
        "2026-04": { Rent: 1200, Groceries: 465, Transport: 110, Dining: 260, Utilities: 118, Health: 40, Fun: 95 },
        "2026-05": { Rent: 1200, Groceries: 398, Transport: 88, Dining: 305, Utilities: 125, Health: 150, Fun: 210 },
        "2026-06": { Rent: 1200, Groceries: 512, Transport: 132, Dining: 288, Utilities: 110, Health: 35, Fun: 175 },
        "2026-07": { Rent: 1200, Groceries: 476, Transport: 104, Dining: 242, Utilities: 121, Health: 90, Fun: 160 },
        "2026-08": { Rent: 1200, Groceries: 288, Transport: 76, Dining: 196, Utilities: 118, Health: 25, Fun: 84 }
      },
      activity: [
        { id: 1, day: "26 Aug", category: "Groceries", note: "Weekly shop", amount: 32, month: "2026-08" },
        { id: 2, day: "25 Aug", category: "Dining", note: "Lunch, office", amount: 18, month: "2026-08" },
        { id: 3, day: "23 Aug", category: "Transport", note: "Tram day pass", amount: 5, month: "2026-08" },
        { id: 4, day: "22 Aug", category: "Fun", note: "Cinema", amount: 24, month: "2026-08" },
        { id: 5, day: "20 Aug", category: "Groceries", note: "Market", amount: 22, month: "2026-08" },
        { id: 6, day: "18 Aug", category: "Health", note: "Pharmacy", amount: 25, month: "2026-08" }
      ]
    });

    const today = new Date();
    const todayLabel = new Intl.DateTimeFormat("en-GB", {
      day: "2-digit",
      month: "short",
      year: "numeric"
    }).format(today);

    const selectedIndex = () => state.monthOrder.indexOf(state.selectedMonth);
    const previousMonth = () => state.monthOrder[selectedIndex() - 1];
    const valuesFor = (month) => state.months[month] ?? {};
    const totalFor = (month) => Object.values(valuesFor(month)).reduce((sum, value) => sum + value, 0);
    const selectedTotal = () => totalFor(state.selectedMonth);
    const previousTotal = () => totalFor(previousMonth());
    const compactNumber = (value) => Math.round(value).toString().replace(/\B(?=(\d{3})+(?!\d))/g, "'");
    const currencyPrefix = () => state.currency.length > 1 ? `${state.currency} ` : state.currency;
    const money = (value) => `${currencyPrefix()}${compactNumber(value)}`;
    const signedMoney = (value) => `${value >= 0 ? "+" : "−"}${money(Math.abs(value))}`;
    const currentMonthKey = () => `${today.getFullYear()}-${String(today.getMonth() + 1).padStart(2, "0")}`;
    const selectedMonthLabel = () => state.monthLabels[state.selectedMonth] ?? state.selectedMonth;
    const previousMonthLabel = () => state.monthLabels[previousMonth()] ?? "start";
    const canAdd = () => Number.parseInt(state.amount, 10) > 0 && Boolean(state.selectedCategory);

    const projection = () => {
      if (state.selectedMonth !== currentMonthKey()) return null;
      const daysInMonth = new Date(today.getFullYear(), today.getMonth() + 1, 0).getDate();
      return Math.round(selectedTotal() / Math.max(today.getDate(), 1) * daysInMonth);
    };

    const monthColumns = () => {
      const maximum = Math.max(...state.monthOrder.map(totalFor), 1);
      return state.monthOrder.map((month) => ({
        month,
        label: state.monthLabels[month],
        total: totalFor(month),
        height: `${Math.max(5, Math.round(totalFor(month) / maximum * 100))}%`
      }));
    };

    const categoryRows = () => {
      const current = valuesFor(state.selectedMonth);
      const previous = valuesFor(previousMonth());
      const total = Math.max(selectedTotal(), 1);

      return state.categories
        .map((category) => {
          const amount = current[category] ?? 0;
          const delta = amount - (previous[category] ?? 0);
          return {
            category,
            amount,
            delta,
            percent: Math.round(amount / total * 100)
          };
        })
        .sort((left, right) => right.amount - left.amount);
    };

    const selectedActivity = () => state.activity.filter((entry) => entry.month === state.selectedMonth);

    const insight = () => {
      const candidate = categoryRows()
        .filter((row) => row.category !== "Rent" && row.delta > 0)
        .sort((left, right) => right.delta - left.delta)[0];

      if (!candidate) return "Spending is below or level with the previous month across flexible categories.";
      return `${candidate.category} is up ${money(candidate.delta)}. That is the clearest place to inspect first.`;
    };

    const commitCategory = () => {
      const draft = state.categoryDraft.trim().replace(/\s+/g, " ");
      if (!draft) {
        state.categoryEditorOpen = false;
        return;
      }

      const existing = state.categories.find((category) => category.toLowerCase() === draft.toLowerCase());
      const category = existing ?? draft.charAt(0).toUpperCase() + draft.slice(1);

      if (!existing) {
        state.categories.push(category);
        state.monthOrder.forEach((month) => {
          state.months[month][category] = 0;
        });
      }

      state.selectedCategory = category;
      state.categoryDraft = "";
      state.categoryEditorOpen = false;
      state.notice = `${category} exists in this browser session only.`;
    };

    const commitCurrency = () => {
      const draft = state.currencyDraft.trim().toUpperCase().slice(0, 4);
      if (!draft) {
        state.currencyEditorOpen = false;
        return;
      }

      const existing = state.currencies.find((currency) => currency.toLowerCase() === draft.toLowerCase());
      if (!existing) state.currencies.push(draft);
      state.currency = existing ?? draft;
      state.currencyDraft = "";
      state.currencyEditorOpen = false;
    };

    const addExpenseLocally = () => {
      const amount = Number.parseInt(state.amount, 10);
      if (!Number.isInteger(amount) || amount <= 0) return;

      const month = state.selectedMonth;
      const category = state.selectedCategory;
      state.months[month][category] = (state.months[month][category] ?? 0) + amount;
      state.activity.unshift({
        id: Date.now(),
        day: todayLabel.replace(String(today.getFullYear()), "").trim(),
        category,
        note: state.note.trim() || "No note",
        amount,
        month
      });
      state.amount = "";
      state.note = "";
      state.notice = `Added ${money(amount)} locally. Refreshing the page will remove it; no POST request was made.`;
    };

    const app = html`
      <header class="masthead">
        <div class="brand">
          <div class="brand__name">GRID</div>
          <div class="eyebrow">Expense ledger</div>
        </div>
        <div class="masthead__tools">
          <div class="currency-picker" aria-label="Display currency">
            <span class="field-label">Currency</span>
            ${() => state.currencies.map((currency) => html`
              <button
                class="${() => `currency-chip${state.currency === currency ? " is-active" : ""}`}"
                type="button"
                aria-pressed="${() => state.currency === currency}"
                @click="${() => state.currency = currency}"
              >${currency}</button>
            `.key(currency))}
            ${() => state.currencyEditorOpen ? html`
              <form class="currency-form" @submit="${(event) => { event.preventDefault(); commitCurrency(); }}">
                <input
                  aria-label="New currency"
                  maxlength="4"
                  placeholder="SEK"
                  .value="${() => state.currencyDraft}"
                  @input="${(event) => state.currencyDraft = event.target.value}"
                >
                <button type="submit">OK</button>
              </form>
            ` : html`
              <button class="currency-add" type="button" aria-label="Add display currency" @click="${() => state.currencyEditorOpen = true}">+</button>
            `}
          </div>
          <div class="meta">${todayLabel}</div>
        </div>
      </header>

      <div class="connection-strip">
        <span
          class="status"
          hx-get="/api/expenses"
          hx-trigger="load"
          hx-swap="innerHTML"
        >Connecting browser → Axum → SQLite…</span>
        <span class="meta">Read-only bridge / no writes</span>
      </div>

      <main class="page">
        <section class="ledger-section">
          <div class="section-heading">
            <div class="section-number">01 / New expense</div>
            <div class="meta">Integer amounts · session preview</div>
          </div>
          <form class="entry-grid" @submit="${(event) => { event.preventDefault(); addExpenseLocally(); }}">
            <div>
              <div class="money-field">
                <span class="money-field__currency">${() => state.currency}</span>
                <input
                  aria-label="Expense amount"
                  inputmode="numeric"
                  pattern="[0-9]*"
                  placeholder="0"
                  autocomplete="off"
                  .value="${() => state.amount}"
                  @input="${(event) => state.amount = event.target.value.replace(/[^0-9]/g, "")}"
                >
              </div>
              <input
                class="note-field"
                aria-label="Expense note"
                maxlength="120"
                placeholder="Note (optional)"
                .value="${() => state.note}"
                @input="${(event) => state.note = event.target.value}"
              >
            </div>

            <div>
              <div class="field-label">Category</div>
              <div class="category-list">
                ${() => state.categories.map((category) => html`
                  <button
                    class="${() => `category-chip${state.selectedCategory === category ? " is-active" : ""}`}"
                    type="button"
                    aria-pressed="${() => state.selectedCategory === category}"
                    @click="${() => state.selectedCategory = category}"
                  >${category}</button>
                `.key(category))}
                ${() => state.categoryEditorOpen ? null : html`
                  <button class="new-category" type="button" @click="${() => state.categoryEditorOpen = true}">+ New category</button>
                `}
              </div>
              ${() => state.categoryEditorOpen ? html`
                <div class="inline-form">
                  <input
                    aria-label="New category name"
                    placeholder="Category name"
                    .value="${() => state.categoryDraft}"
                    @input="${(event) => state.categoryDraft = event.target.value}"
                  >
                  <button type="button" @click="${commitCategory}">Add</button>
                  <button class="button-secondary" type="button" @click="${() => { state.categoryEditorOpen = false; state.categoryDraft = ""; }}">Cancel</button>
                </div>
              ` : null}
              <button class="add-expense" type="submit" disabled="${() => canAdd() ? false : ""}">
                <span>Add expense</span>
                <span class="button-note">Local only →</span>
              </button>
              <p class="notice" aria-live="polite">${() => state.notice}</p>
            </div>
          </form>
        </section>

        <section class="ledger-section">
          <div class="section-heading">
            <div class="section-number">02 / Month — ${() => selectedMonthLabel()}</div>
            <div class="meta">${() => state.selectedMonth === currentMonthKey() ? `Through ${today.getDate()} ${selectedMonthLabel()}` : "Closed month"}</div>
          </div>
          <div class="month-grid">
            <div class="month-summary">
              <div class="total">${() => money(selectedTotal())}</div>
              <div class="total-meta">
                <div class="metric">
                  <strong>${() => signedMoney(selectedTotal() - previousTotal())}</strong>
                  <span class="meta">vs ${() => previousMonthLabel()}</span>
                </div>
                ${() => projection() === null ? null : html`
                  <div class="metric">
                    <strong>${() => money(projection())}</strong>
                    <span class="meta">projected</span>
                  </div>
                `}
              </div>
            </div>

            <div>
              <div class="bars" aria-label="Monthly expense comparison">
                ${() => monthColumns().map((column) => html`
                  <button
                    class="${() => `bar-button${state.selectedMonth === column.month ? " is-active" : ""}`}"
                    type="button"
                    aria-label="${() => `${column.label}: ${money(totalFor(column.month))}`}"
                    aria-pressed="${() => state.selectedMonth === column.month}"
                    @click="${() => state.selectedMonth = column.month}"
                  >
                    <span class="bar-value">${() => money(totalFor(column.month))}</span>
                    <span class="bar-fill" style="${() => `--height: ${monthColumns().find((item) => item.month === column.month).height}`}"></span>
                  </button>
                `.key(column.month))}
              </div>
              <div class="bar-labels">
                ${() => state.monthOrder.map((month) => html`<div class="bar-label">${state.monthLabels[month]}</div>`.key(month))}
              </div>
              <div class="meta" style="margin-top: 0.8rem">Tap a bar to compare</div>
            </div>
          </div>
        </section>

        <div class="lower-grid">
          <section class="ledger-section">
            <div class="section-heading">
              <div class="section-number">03 / Categories</div>
              <div class="meta">Δ vs ${() => previousMonthLabel()}</div>
            </div>
            ${() => categoryRows().map((row) => html`
              <div class="category-row">
                <div class="category-row__top">
                  <div class="category-name">${row.category}</div>
                  <div class="category-numbers">
                    <div class="category-amount">${() => money(valuesFor(state.selectedMonth)[row.category] ?? 0)}</div>
                    <div class="${() => {
                      const delta = (valuesFor(state.selectedMonth)[row.category] ?? 0) - (valuesFor(previousMonth())[row.category] ?? 0);
                      return `category-delta${delta > 0 ? " is-up" : delta < 0 ? " is-down" : ""}`;
                    }}">
                      ${() => signedMoney((valuesFor(state.selectedMonth)[row.category] ?? 0) - (valuesFor(previousMonth())[row.category] ?? 0))}
                    </div>
                  </div>
                </div>
                <div class="category-meter">
                  <div class="category-track"><span style="${() => `--width: ${Math.round((valuesFor(state.selectedMonth)[row.category] ?? 0) / Math.max(selectedTotal(), 1) * 100)}%`}"></span></div>
                  <div class="category-percent">${() => `${Math.round((valuesFor(state.selectedMonth)[row.category] ?? 0) / Math.max(selectedTotal(), 1) * 100)}%`}</div>
                </div>
              </div>
            `.key(row.category))}
            <aside class="insight">
              <div class="field-label">Where to look</div>
              <p>${() => insight()}</p>
            </aside>
          </section>

          <section class="ledger-section">
            <div class="section-heading">
              <div class="section-number">04 / Activity</div>
              <div class="meta">${() => selectedActivity().length} entries</div>
            </div>
            ${() => selectedActivity().length === 0 ? html`
              <div class="empty-state">No itemised entries for this month. Add an expense above to preview the activity flow.</div>
            ` : selectedActivity().map((entry) => html`
              <div class="activity-row">
                <div class="activity-main">
                  <div class="activity-date">${entry.day}</div>
                  <div>
                    <div class="activity-category">${entry.category}</div>
                    <div class="activity-note">${entry.note}</div>
                  </div>
                </div>
                <div class="activity-amount">${() => money(entry.amount)}</div>
              </div>
            `.key(entry.id))}
          </section>
        </div>

        <footer class="page-footer">
          <span class="meta">GRID / Personal operating system</span>
          <a href="#expense-app">Back to top ↑</a>
        </footer>
      </main>
    `;

    const root = document.querySelector("#expense-app");
    app(root);
    window.htmx?.process(root);
  </script>
</body>
</html>
