[package]
name = "andrei-os"
version = "0.1.0"
edition = "2024"

[dependencies]
axum = "0.8.9"
serde = { version = "1.0.229", features = ["derive"] }
tokio = { version = "1.53.1", features = ["macros", "net", "rt-multi-thread"] }
sqlx = {
    version = "0.9.0",
    default-features = false,
    features = ["runtime-tokio", "sqlite", "macros", "migrate"]
}
thiserror = "2.0.20"
tracing = "0.1.44"
